<script id="data" type="application/json">{"chapters":[["Before the empire","Prehistoric–early historic","The valley before kings","The Malaprabha river, sandstone cliffs and megalithic remains form the setting for the later temple landscape. The exact chronology of early settlement remains an archaeological question.","land","U"],["Before the empire","Before c. 543 CE","The pre-Chalukyan Deccan","Regional kingdoms and diverse religious traditions preceded the rise of Vatapi. The surviving temple groups mostly belong to later centuries.","land","U"],["Early Chalukyas","c. 543–566 CE","A capital in stone","Pulakeshin I established Chalukyan power at Vatapi, present-day Badami. Its dramatic cliffs offered a naturally fortified setting.","badami","B"],["Early Chalukyas","c. 566–597 CE","Kirtivarman I","Political expansion and royal patronage helped transform Vatapi into an imperial centre.","badami","B"],["Early Chalukyas","c. 597–610 CE","Carving the living rock","Mangalesha was associated with the development of the cave complex. The inscription in Cave 3 places its foundation in 578 CE, before his reign. The caves reveal a rock-cut tradition developed across several phases.","badami","B"],["Early Chalukyas","c. 610–642 CE","Pulakeshin II","The kingdom expanded across the Deccan, competing with the Pallavas and other regional powers.","map","B"],["Early Chalukyas","634 CE","History inscribed in stone","Ravikirti’s Meguti Jain temple inscription at Aihole records the achievements of Pulakeshin II.","aihole","U"],["Early Chalukyas","c. 642–655 CE","The struggle for Vatapi","Pallava forces captured Vatapi around 642 CE. Chalukyan power was subsequently restored under Vikramaditya I.","badami","B"],["Early Chalukyas","c. 655–697 CE","The age of experiments","The temple groups reveal diverse plans, tower forms and structural solutions. Aihole and Badami developed in overlapping phases.","aihole","U"],["Early Chalukyas","c. 697–733 CE","Sangameshwara","Vijayaditya is associated with the Sangameshwara temple at Pattadakal, an important example of southern temple architecture.","pattadakal","A"],["Early Chalukyas","c. 733–746 CE","The queens of Pattadakal","Queen Lokamahadevi commissioned Virupaksha around 740 CE to commemorate Vikramaditya II’s victories. Mallikarjuna is associated with Queen Trailokyamahadevi.","pattadakal","W"],["Early Chalukyas","c. 746–753 CE","The end of an imperial age","The Badami Chalukyas gave way to Rashtrakuta power in the mid-eighth century. Their architectural legacy survived.","map","U"],["Rashtrakutas","c. 753–973 CE","A Jain sanctuary","Pattadakal’s Jain Narayana temple belongs to the Rashtrakuta period, showing continued temple building after the Early Chalukyas.","pattadakal","A"],["Later Chalukyas","c. 973–late 12th century","Kalyani and a new language","The Western Chalukyas of Kalyani developed a distinctive later Deccan temple tradition. This is a regional architectural comparison, not a claim that all three sites were rebuilt.","pattadakal","U"],["Regional powers","12th–14th century","Changing kingdoms","Kalachuris, Hoysalas and Yadavas were among the powers of the wider Deccan. Site-specific political and construction chronologies require further study.","map","U"],["Medieval Deccan","14th–16th century","The Vijayanagara era","Badami came under Vijayanagara rule. The ancient monuments survived changing political circumstances.","badami","B"],["Medieval Deccan","14th–17th century","Sultanates and forts","The Bahmani and successor sultanates transformed the regional landscape. Badami was later held by the Adil Shahis.","badami","B"],["Regional powers","17th–19th century","A changing frontier","Badami’s later history includes Marathas, Savanur Nawabs, Hyder Ali and British rule. The sequence for each site needs further archival verification.","map","B"],["Colonial period","19th century","Recording the monuments","Archaeological surveys and documentation gradually brought the temple groups to wider scholarly attention. Archival records can deepen this chapter.","land","U"],["Modern India","20th century","Preserving the stone","Documentation, conservation and interpretation became essential to protecting the surviving monuments.","pattadakal","A"],["World Heritage","1987","A world heritage landmark","Pattadakal was inscribed on the UNESCO World Heritage List in 1987 for its exceptional architectural achievements.","pattadakal","W"],["Living heritage","2015–present","The story continues","India proposed Aihole and Badami as part of a wider heritage ensemble with Pattadakal in 2015. A tentative listing is not a World Heritage inscription.","land","U"]],"sites":[["Aihole","Durga Temple","Early medieval; debated","A rare apsidal (horseshoe-ended) shrine with a passage around the sanctum and an entrance porch. The surviving colonnade and raised platform make the plan particularly legible.","U","Look for the curved rear end and the corridor around the shrine.","The Durga Temple of Aihole.jpg","The Durga shrine demonstrates how a curved sanctuary and surrounding colonnade can be combined in a freestanding stone building. Its plan illustrates the range of solutions explored at Aihole, rather than a universal Chalukyan temple plan."],["Aihole","Lad Khan","Early Chalukyan; debated","An early structural experiment: the shrine stands against the rear of a pillared hall beneath a low roof rather than a developed tower.","U","Compare the roof profile with Konti Gudi.","Lad Khan temple, Aihole, Karnataka.jpg","Lad Khan is important because the hall and roof are more prominent than a tall tower. Its fabric illustrates the diversity of structural shrines before the monumental forms seen at Pattadakal."],["Aihole","Ravana Phadi","Early Chalukyan","An early Shaiva rock-cut sanctuary. Its carved Shiva panels illustrate the transition from rock excavation to complex sacred interiors.","T","Compare the excavated facade with the freestanding Lad Khan shrine.","Ravana phadi cave temple. Aihole.jpg","Ravana Phadi presents a contrasting architectural method: a sanctuary excavated from rock rather than assembled from separate blocks. Its Shiva imagery shows how sacred sculpture and architectural space were designed together."],["Aihole","Meguti Jain Temple","634 CE inscription","Jain hilltop sanctuary with a circumambulatory passage and a hall in front. Its inscription, associated with Pulakeshin II and Ravikirti, is dated 634 CE.","U","Study the relationship between the shrine and surrounding passage.","Meguti Jain temple Aihole.jpg","Meguti is both a Jain monument and an important historical record. Ravikirti’s inscription provides a dated reference for the reign of Pulakeshin II, connecting architecture with written evidence."],["Aihole","Huchimalli","Early medieval","An example of a developed northern-style Rekha superstructure. Its sanctum is incorporated into the enclosed hall.","U","Notice the tower above the sanctuary.","Huchimalligudi Temple, Aihole.JPG","Huchimalli demonstrates how the enclosed hall and sanctuary relate to the tower. Comparison with Lad Khan shows that Aihole was not defined by just one building type."],["Aihole","Konti group","Early medieval","The group includes four identified structures in India’s heritage nomination. Their sanctums are positioned at the rear of pillared halls, with low roof forms.","U","Compare the four buildings rather than assuming one standard plan.","Aihole Konti Gudi 1.jpg","The Konti group is a comparative ensemble: adjoining buildings allow variations in roof, hall and sanctuary arrangement to be studied in one location. Exact building phases remain a separate question."],["Badami","Cave 1","Late 6th century","The first cave is Shaiva. Its reliefs include eighteen-armed dancing Shiva, Ganesha and Ardhanarishvara; the ceiling includes a serpent motif.","B","Look at the Nataraja relief and ceiling.","Rock Cut Cave 1, Badami.jpg","Cave 1 combines an excavated hall with an elaborate Shaiva sculptural programme. Its Nataraja and other figures demonstrate that the cave was designed as a complete sacred interior."],["Badami","Cave 2","Late 6th century","Vaishnava themes predominate, notably Trivikrama and Bhuvaraha. Ceiling carvings include directional deities.","B","Compare the Vishnu imagery with Cave 1.","7th century Cave 2 entrance, Badami Hindu cave temple Karnataka 1.jpg","Cave 2 is an example of the Vaishnava tradition at Badami. Its Vishnu reliefs and ceiling carvings reveal how religious imagery was distributed throughout the architecture."],["Badami","Cave 3","578 CE inscription","The largest cave contains an inscription recording Mangalesha’s foundation in 578 CE. Vishnu-related reliefs include Narasimha and Trivikrama.","B","Inspect the carved brackets and expansive hall.","6th century entrance to Cave 3, Badami Hindu cave temple Karnataka.jpg","The dated inscription makes Cave 3 a key chronological reference for Badami’s rock-cut architecture. Its scale and sculptured pillars demonstrate the ambition of Early Chalukyan workshops."],["Badami","Cave 4","Early medieval","A Jain sanctuary east of Cave 3, with Mahavira in the sanctum and reliefs of other Tirthankaras.","B","Compare the Jain sculptural programme with the Hindu caves.","Entrance of the Badami cave temple no.4.jpg","Cave 4 demonstrates the religious diversity of the Badami complex. Jain images coexist in a landscape of Shaiva and Vaishnava sanctuaries, illuminating the range of religious patronage."],["Badami","Upper Shivalaya","Early Chalukyan","On the northern hill, its southern-style tower rises above a shrine with a surrounding passage. Part of the hall has collapsed.","U","Look for the remaining hall and rear circular openings.","Upper Shivalaya - Badami.jpg","Upper Shivalaya helps trace the development of freestanding stone construction at Badami. Its tower and passage around the sanctuary offer a comparison with the more developed temples at Pattadakal."],["Badami","Lower Shivalaya","Early medieval","A surviving sanctum with a southern-style tower on the northern hill. The district administration describes it as the remnant of a larger temple.","B","Distinguish surviving fabric from any reconstruction.","HBPA N 989 Badami Lower Shivalaya.jpg","Lower Shivalaya is valuable precisely because it is fragmentary: the surviving shrine can be examined without assuming the missing structure looked like another monument."],["Badami","Malegitti Shivalaya","Early Chalukyan","A structural temple on the northern outcrop. A porch leads to an enclosed pillared hall and sanctuary beneath a southern tower.","U","Study the sequence of spaces from porch to shrine.","HBPA N 1010 Malegitti Shivalaya Badami.jpg","Malegitti Shivalaya illustrates the organization of sacred space through a sequence of porch, enclosed hall and shrine beneath a southern-style tower."],["Badami","Bhutanatha","Multiple phases","The main lakeside shrine has a pillared hall connected to its sanctum and a southern superstructure. Its entrance porch is a later addition.","U","Notice how the lake and successive building phases shape the complex.","Bhutanatha temple complex in Badami with Agastya Lake.jpg","Bhutanatha shows how architecture develops in successive phases. The lakeside position and later porch addition reveal the relationship between monuments and their surroundings."],["Badami","Agastya Lake and Fort","Multiple phases","The district identifies hilltop fortifications, storage structures and temples overlooking the Agastya Tirtha tank. These features represent different phases of occupation.","B","Read the lake, cliffs and fort as a landscape rather than a single building.","Upper and Lower Shivalaya by the Badami Town and Agastya Lake.jpg","The fortified hills and tank explain why Vatapi’s setting mattered. The water, natural cliffs and surviving buildings represent a landscape occupied and altered over many historical periods."],["Pattadakal","Kadasiddheshwara","7th century, attributed","ASI attributes this compact shrine to the seventh century. A hall and sanctuary support a northern-style architectural composition.","A","Compare its tower with the southern forms nearby.","Kadasiddheshvara Temple, Pattadakal, Karnataka, India.jpg","Kadasiddheshwara is useful for comparing compact northern-style shrines with the larger southern complexes nearby. Even modest buildings participated in architectural experimentation."],["Pattadakal","Jambulingeshwara","7th century, attributed","A northern-style shrine with a facade arch and a relief showing dancing Shiva alongside Parvati and Nandi.","P","Look for the carved facade projection.","Jambulingeshwara Temple, Pattadikal.jpg","Jambulingeshwara’s northern tower and sculpted façade illustrate the relationship between architectural elevation and religious imagery. Compare its scale with Virupaksha."],["Pattadakal","Sangameshwara","c. 697–733 CE","Built under Vijayaditya (697–733 CE), the temple has three tower storeys and a covered passage around the sanctuary.","A","Compare its square plan and absent sukanasika with Virupaksha.","Pattadakal - Sangameshwara Temple.jpg","Sangameshwara is an important predecessor of the larger southern-style royal shrines. Its three-level tower and enclosed circumambulatory passage illuminate the architectural development described by ASI."],["Pattadakal","Galaganatha","8th century, attributed","Its sandstone northern tower and relief of Shiva overcoming Andhakasura are noted by the district administration; the building may be unfinished.","P","Compare the curving tower with Sangameshwara.","Galaganatha temple Pattadakal.jpg","Galaganatha demonstrates the curving northern tower tradition at Pattadakal. Its juxtaposition with southern-style temples is evidence of different approaches within one major site."],["Pattadakal","Chandrashekhara","Early medieval","A smaller shrine within the Pattadakal monument group. The precise construction date is not established by the institutional sources used here.","W","Use the photograph to study its restrained massing.","Pattadakal, Chandrashekhara temple.jpg","Chandrashekhara contrasts with elaborate royal shrines. Its modest form is valuable for comparing structures within the heritage group; a precise patron or construction date is not established in the sources used here."],["Pattadakal","Kashi Vishwanatha","8th century, attributed","ASI identifies this shrine as a late example of the Early Chalukyan building tradition. It belongs to the northern-style group at Pattadakal.","A","Compare the roof profile with Galaganatha. The photograph shows this temple at right.","7th - 8th century Galaganatha, Sangameswara and Kashivishweswara (right) Hindu temples, Pattadakal monuments Karnataka.jpg","Kashi Vishwanatha is attributed by ASI to the late phase of Early Chalukyan building at Pattadakal. Its northern-style form demonstrates the mature site’s architectural diversity."],["Pattadakal","Mallikarjuna","8th century","Commissioned by Queen Trailokyamahadevi, it is smaller than Virupaksha and has a four-storeyed tower with rounded neck and crowning element.","A","Compare the two queens’ temples side by side.","Mallikarjuna Temple, Pattadakal, Karnataka.jpg","Mallikarjuna is significant for royal female patronage and its relationship to Virupaksha. Comparing the two reveals related architectural ideas at different scales and distinct narrative sculptures."],["Pattadakal","Virupaksha","c. 740 CE","Queen Lokamahadevi commissioned this temple around 740 CE after Vikramaditya II’s victories. Its large complex includes axial halls, subsidiary shrines and enclosure gateways.","W","Identify the tower, halls and gateways.","Virupaksha temple side view from entrance to Mallikarjuna Temple.jpg","Virupaksha is central to understanding the culmination of Chalukyan architecture. Its integrated shrine, halls and enclosure demonstrate a mature approach to planning. UNESCO identifies it as an outstanding monument of the group."],["Pattadakal","Papanatha","c. 680 CE (district attribution; debated)","An ornate shrine outside the main enclosure, with epic narrative carvings. The district dates it approximately to 680 CE; other chronologies vary.","P","Inspect the reliefs from the Ramayana and Mahabharata.","Papanatha temple at Pattadakal.jpg","Papanatha preserves a different approach to temple design from the large southern-style complexes. Its epic reliefs connect sculptural narratives with architecture; published dates differ."],["Pattadakal","Jain Narayana","9th century, attributed","A ninth-century Jain shrine associated by ASI with Rashtrakuta Krishna II. The two lower levels of its tower are functional.","A","Compare its multi-level form with earlier Chalukyan shrines.","Jain Narayana temple at Pattadakal 1.jpg","Jain Narayana establishes that major religious building at Pattadakal continued after the Early Chalukya dynasty. ASI associates it with ninth-century Rashtrakuta patronage, making it a marker of the next historical phase."]],"terms":[["Adhisthana","Raised base or plinth."],["Garbhagriha","Innermost sanctuary housing the sacred image."],["Pradakshina patha","Circumambulatory passage, where present."],["Antarala","Vestibule between shrine and hall."],["Stambha","Pillar."],["Mandapa","Pillared hall."],["Mukhamandapa","Entrance porch."],["Dvarashakha","Doorframe member."],["Prastara","Horizontal entablature."],["Vimana","Southern shrine or its superstructure, depending on context."],["Shikhara","Tower or crowning element; usage varies by tradition."],["Griva","Neck below the crowning element."],["Kalasha","Vessel-shaped finial, where present."],["Nagara","Northern architectural tradition."],["Dravida","Southern architectural tradition with tiered forms."],["Vesara","Variable historical terminology for Deccan forms; not a fixed hybrid category."]],"sources":{"U":["UNESCO — Evolution of Temple Architecture","https://whc.unesco.org/en/tentativelists/5972/"],"W":["UNESCO — Pattadakal","https://whc.unesco.org/en/list/239/"],"A":["Archaeological Survey of India — Pattadakal","https://asi.nic.in/pages/WorldHeritagePattadakal"],"B":["Bagalkote District — Badami","https://bagalkot.nic.in/en/tourist-place/badami-caves/"],"T":["Karnataka Tourism — Aihole","https://karnatakatourism.org/en/destinations/aihole/"],"P":["Bagalkote District — Pattadakal","https://bagalkot.nic.in/en/tourist-place/pattadakal/"]}}</script>
<script>
'use strict';
const {chapters,sites,terms,sources}=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s), clamp=(n,a=0,b=1)=>Math.min(b,Math.max(a,n));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const source=k=>'<a href="'+sources[k][1]+'" target="_blank" rel="noopener">'+sources[k][0]+' ↗</a>';
const rect=(x,y,w,h,f)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"/>';
function temple(x=0,y=0,type='pattadakal',s=1){let t='<g transform="translate('+x+' '+y+') scale('+s+')" stroke="#523322" stroke-width="1.1">';
t+=rect(0,150,260,12,'#825337')+rect(8,140,244,10,'#c88d59')+rect(18,132,224,9,'#9d6743')+rect(30,74,194,58,'#a76f46')+rect(95,78,45,54,'#302016');
for(let i=0;i<6;i++){let a=35+i*35;t+=rect(a,77,12,54,'#d3a16d')+rect(a-3,73,18,7,'#b77d4d')+rect(a-3,126,18,5,'#765034');}
t+=rect(23,65,210,10,'#c38a58')+rect(17,58,222,7,'#8d5b3a');
if(type==='aihole'){t+='<path d="M23 58 L50 38 H202 L233 58Z" fill="#b77f51"/>'+rect(48,32,156,7,'#d0a06c');}
else if(type==='nagara'){t+='<path d="M125 58 Q129 9 166 -13 Q202 11 209 58Z" fill="#bc8252"/>';for(let i=0;i<4;i++)t+='<path d="M'+(135+i*15)+' 57 Q '+(142+i*9)+' 12 166 -12" fill="none" stroke="#70472f" stroke-width="2"/>';t+=rect(151,-17,30,5,'#d9a26b');}
else{for(let i=0;i<4;i++){let w=100-i*20,a=166-w/2,b=57-i*17;t+=rect(a,b-12,w,12,'#c68e58')+rect(a-4,b-2,w+8,5,'#805232');for(let j=0;j<Math.floor(w/16);j++)t+=rect(a+5+j*16,b-11,6,8,'#8e5d3b');}t+='<path d="M150 -7 Q166 -25 182 -7Z" fill="#e0b07c"/>';}
return t+'</g>';}
function scene(kind){let t='<svg viewBox="0 0 680 330" aria-hidden="true">';
if(kind==='map')return t+'<path d="M300 15 L380 45 420 105 495 115 530 162 457 191 409 246 370 315 340 267 310 222 250 180 205 125 240 69Z" fill="#b78b63" stroke="#e4bd8a" stroke-width="2"/><path d="M270 154Q335 130 429 173T383 241Q323 229 270 154" fill="#8b442c" opacity=".8"/><circle cx="326" cy="192" r="5" fill="#ffe3a5"/><text x="338" y="196" fill="#fff1d4" font-size="13">Vatapi</text><text x="340" y="27" fill="#d9bb97" font-size="11" text-anchor="middle">REGIONAL SCHEMATIC · NOT TERRITORIAL BOUNDARIES</text></svg>';
if(kind==='land')return t+'<path d="M0 190L120 90 250 160 390 50 540 135 680 80V300H0Z" fill="#895e42"/><path d="M0 235Q180 180 340 250T680 225V330H0Z" fill="#77765a"/><path d="M0 280Q170 220 340 275T680 265" stroke="#a6a38b" stroke-width="35" fill="none"/></svg>';
if(kind==='badami'){t+='<path d="M20 260V90L110 60 200 76 252 26 425 48 470 90 605 110 660 260Z" fill="#ad7045"/>';for(let i=0;i<10;i++)t+='<path d="M25 '+(90+i*17)+' Q330 '+(67+i*17)+' 650 '+(110+i*15)+'" stroke="#573725" stroke-width="4" fill="none" opacity=".6"/>';t+=rect(175,144,330,117,'#4b2d20');for(let i=0;i<5;i++)t+=rect(185+i*75,151,16,110,'#cd9b67');return t+rect(150,260,390,13,'#c08c58')+'</svg>';}
return t+'<ellipse cx="340" cy="290" rx="285" ry="25" fill="#000" opacity=".35"/>'+temple(125,66,kind,1.65)+'</svg>';}
function hero(){let t='<svg class="hero-art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#372833"/><stop offset=".56" stop-color="#c17d56"/><stop offset="1" stop-color="#eac295"/></linearGradient><linearGradient id="rock" x2=".4" y2="1"><stop stop-color="#c27b48"/><stop offset="1" stop-color="#472c20"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#b89168"/><stop offset="1" stop-color="#342f29"/></linearGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="3" stitchTiles="stitch"/></filter></defs><rect width="1440" height="900" fill="url(#sky)"/><circle cx="1120" cy="290" r="84" fill="#f4c997" opacity=".75"/><path d="M0 435L160 340 265 382 420 290 540 359 730 280 880 340 1000 270 1220 360 1440 285V680H0Z" fill="#785844"/><path d="M0 210L220 235 270 145 460 170 500 260 690 260 740 322 830 310 900 410 970 450 1040 530 0 650Z" fill="url(#rock)"/><path d="M0 670Q500 530 910 605T1440 570V900H0Z" fill="url(#water)"/>';
for(let i=0;i<50;i++){let x=i*131%900,y=240+i*53%300;t+='<path d="M'+x+' '+y+' l'+(80+i%5*16)+' 8 -12 14 -74 -7Z" fill="'+(i%2?'#472b20':'#e09b5a')+'" opacity=".35"/>';}t+='<path d="M0 605 Q310 550 530 610T900 620L900 688H0Z" fill="#3b3c28"/>'+temple(960,460,'pattadakal',1.45)+temple(1150,540,'aihole',.85);for(let i=0;i<35;i++){let y=700+i*6,x=i*193%1400;t+='<path d="M'+x+' '+y+' h'+(50+i%6*19)+'" stroke="#e3b98b" stroke-opacity=".23"/>';}return t+'<rect width="1440" height="900" filter="url(#grain)" opacity=".07"/></svg>';}

/* Photographs: exact, individually selected Commons file titles. Licensing and
   attribution are fetched from the Commons imageinfo API before display. */

const photoCache=new Map();
const photoFiles=sites.map(m=>m[6]);
const archiveFile='1855 photo of Papanatha Temple, Pattadakal Karnataka.jpg';
const megutiFile='Meguti Jain temple Aihole.jpg';
photoCache.set(megutiFile,{
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Meguti_Jain_temple_Aihole.jpg/960px-Meguti_Jain_temple_Aihole.jpg',
 original:'https://upload.wikimedia.org/wikipedia/commons/6/64/Meguti_Jain_temple_Aihole.jpg',
 artist:'Rajeshodayanchal',lic:'CC BY 3.0',license:'https://creativecommons.org/licenses/by/3.0/',
 page:'https://commons.wikimedia.org/wiki/File:Meguti_Jain_temple_Aihole.jpg'
});
const heroFile='Mallikarjuna and Virupaksha Temples-Pattadakal.jpg';
const heroPage='https://commons.wikimedia.org/wiki/File:Mallikarjuna_and_Virupaksha_Temples-Pattadakal.jpg';
photoCache.set(heroFile,{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Mallikarjuna_and_Virupaksha_Temples-Pattadakal.jpg/1280px-Mallikarjuna_and_Virupaksha_Temples-Pattadakal.jpg',artist:'Shivajidesai29',lic:'CC BY-SA 4.0',license:'https://creativecommons.org/licenses/by-sa/4.0/',page:heroPage});
function photoMarkup(file,caption,extra=''){
 const link='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file.replace(/ /g,'_'));
 return '<figure class="real-photo '+extra+'" data-file="'+esc(file)+'"><div class="photo-slot">Loading photograph…</div><figcaption>'+esc(caption)+' <span class="photo-credit"><a href="'+link+'" target="_blank" rel="noopener">Original photograph / licence</a></span></figcaption></figure>';
}
function plainText(s){return (new DOMParser().parseFromString(String(s||''),'text/html').body.textContent||'').trim();}

const chapterPhotos=[
 ['ai0','Imagined early communities in the Malaprabha valley'],
 ['ai1','Imagined pre-Chalukyan settlement in the Deccan'],
 ['ai2','Pulakeshin I and the rise of Vatapi — imagined portrait and setting'],
 ['ai3','Kirtivarman I — imagined royal court'],
 ['ai4','Mangalesha and rock-cut craftsmanship — imagined scene'],
 ['ai5','Pulakeshin II — imagined royal portrait'],
 [3,'Meguti Jain Temple, Aihole — photograph of the surviving hilltop temple'],
 ['ai7','A Chalukyan court during the era of restoration — imagined scene'],
 [1,'Lad Khan, Aihole — architectural experimentation'],
 ['ai8','Vijayaditya and temple planning — imagined scene'],
 ['ai9','Vikramaditya II and the royal queens — imagined patronage scene'],
 [23,'Papanatha — surviving Early Chalukyan legacy'],
 ['ai10','Rashtrakuta royal patronage — imagined scene, not a likeness of a specific king'],
 ['ai11','Later Chalukyan artisans and royal patronage — imagined regional scene'],
 [10,'Upper Shivalaya — surviving earlier architecture; regional context'],
 [14,'Badami and fortified hills — present-day landscape'],
 [14,'Badami landscape — surviving monuments and fortifications'],
 [14,'Badami — present-day landscape, not a period reconstruction'],
 ['archive','Thomas Biggs, 1855 — archival photograph of Papanatha'],
 [22,'Virupaksha — surviving monument under conservation'],
 ['hero','Mallikarjuna and Virupaksha — Pattadakal World Heritage group'],
 [0,'Durga Temple — part of the proposed wider heritage ensemble']
];
function aiMarkup(index,caption,extra=''){
 const col=index%4,row=Math.floor(index/4);
 return '<figure class="ai-figure chapter-photo '+extra+'"><div class="ai-frame"><div class="ai-art" role="img" aria-label="'+esc(caption)+'" style="background-position:'+(col*100/3)+'% '+(row*50)+'%"></div><span class="ai-label">AI RECONSTRUCTION</span></div><figcaption>'+esc(caption)+'<span class="photo-credit">Artistic interpretation, not an authentic portrait or archaeological reconstruction.</span></figcaption></figure>';
}
function historyPhoto(i){
 const [j,caption]=chapterPhotos[i];
 if(typeof j==='string'&&j.startsWith('ai'))return aiMarkup(Number(j.slice(2)),caption);
 return photoMarkup(j==='archive'?archiveFile:j==='hero'?heroFile:photoFiles[j],caption,'chapter-photo');
}
let catalogPromise=null;
function getCatalog(){
 if(catalogPromise)return catalogPromise;
 catalogPromise=(async()=>{
  const titles=[...new Set([...photoFiles,archiveFile,heroFile])],batches=[];
  for(let i=0;i<titles.length;i+=12)batches.push(titles.slice(i,i+12));
  await Promise.all(batches.map(async batch=>{
   const params=new URLSearchParams({action:'query',format:'json',origin:'*',redirects:'1',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'960',titles:batch.map(t=>'File:'+t).join('|')});
   try{
    const res=await fetch('https://commons.wikimedia.org/w/api.php?'+params);
    if(!res.ok)throw Error('Photo metadata unavailable');
    const j=await res.json(),q=j.query||{};
    const aliases=new Map([...(q.normalized||[]),...(q.redirects||[])].map(x=>[x.from,x.to]));
    for(const p of Object.values(q.pages||{})){
     const v=p.imageinfo?.[0];if(!v)continue;
     const m=v.extmetadata||{},lic=plainText(m.LicenseShortName?.value),artist=plainText(m.Artist?.value)||plainText(m.Credit?.value);
     if(!/^(CC BY|CC0|Public domain|PD)/i.test(lic)||(!artist&&/^CC BY/i.test(lic)))continue;
     const item={url:v.thumburl||v.url,artist,lic,license:m.LicenseUrl?.value||'',page:v.descriptionurl,original:v.url};
     photoCache.set(p.title.replace(/^File:/,''),item);
     for(const title of batch){let t='File:'+title;for(let n=0;n<5&&aliases.has(t);n++)t=aliases.get(t);if(t===p.title)photoCache.set(title,item);}
    }
   }catch(e){console.warn('Commons photo lookup failed:',e);}
  }));
 })();
 return catalogPromise;
}
function displayPhoto(f,v){
 const slot=f.querySelector('.photo-slot');if(!slot||!v)return;
 const img=document.createElement('img');img.alt=f.querySelector('figcaption').firstChild.textContent.trim();
