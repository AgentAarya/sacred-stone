<script id="data" type="application/json">{"chapters":[["Before the empire","Prehistoric–early historic","The valley before kings","The Malaprabha river, sandstone cliffs and megalithic remains form the setting for the later temple landscape. The exact chronology of early settlement remains an archaeological question.","land","U"],["Before the empire","Before c. 543 CE","The pre-Chalukyan Deccan","Regional kingdoms and diverse religious traditions preceded the rise of Vatapi. The surviving temple groups mostly belong to later centuries.","land","U"],["Early Chalukyas","c. 543–566 CE","A capital in stone","Pulakeshin I established Chalukyan power at Vatapi, present-day Badami. Its dramatic cliffs offered a naturally fortified setting.","badami","B"],["Early Chalukyas","c. 566–597 CE","Kirtivarman I","Political expansion and royal patronage helped transform Vatapi into an imperial centre.","badami","B"],["Early Chalukyas","578–c. 610 CE","Carving the living rock","The inscription in Cave 3 records its dedication in 578 CE, during Kirtivarman I’s reign. Mangalesha, who later ruled around 597–610 CE, was associated with the cave’s patronage. The caves preserve a remarkable rock-cut tradition.","badami","B"],["Early Chalukyas","c. 610–642 CE","Pulakeshin II","The kingdom expanded across the Deccan, competing with the Pallavas and other regional powers.","map","B"],["Early Chalukyas","634 CE","History inscribed in stone","Ravikirti’s Meguti Jain temple inscription at Aihole records the achievements of Pulakeshin II.","aihole","U"],["Early Chalukyas","c. 642–655 CE","The struggle for Vatapi","Pallava forces captured Vatapi around 642 CE. Chalukyan power was subsequently restored under Vikramaditya I.","badami","B"],["Early Chalukyas","c. 655–697 CE","The age of experiments","The temple groups reveal diverse plans, tower forms and structural solutions. Aihole and Badami developed in overlapping phases.","aihole","U"],["Early Chalukyas","c. 697–733 CE","Sangameshwara","ASI associates Sangameshwara (also called Vijayeshwara) with Vijayaditya (697–733 CE). Its three-storeyed tower and covered circumambulatory passage illustrate the mature southern temple form.","pattadakal","A"],["Early Chalukyas","c. 733–746 CE","The queens of Pattadakal","Queen Lokamahadevi commissioned Virupaksha around 740 CE to commemorate Vikramaditya II’s victories. Queen Trailokyamahadevi commissioned neighbouring Mallikarjuna. These temples illustrate the importance of royal female patronage.","pattadakal","W"],["Early Chalukyas","c. 746–753 CE","The end of an imperial age","The Badami Chalukyas gave way to Rashtrakuta power in the mid-eighth century. Their architectural legacy survived.","map","U"],["Rashtrakutas","c. 753–973 CE","A Jain sanctuary","The Jain Narayana temple at Pattadakal is generally attributed to the Rashtrakuta period, around the ninth century. It demonstrates continued temple patronage after the Early Chalukyas.","pattadakal","A"],["Later Chalukyas","c. 973–late 12th century","Kalyani and a new language","The Western Chalukyas of Kalyani developed a later Deccan architectural tradition. Mahadeva Temple at Itagi, near Koppal, is a notable example dated to 1112 CE. Itagi is a regional comparison outside Aihole, Badami and Pattadakal.","pattadakal","K"],["Regional powers","12th–14th century","Changing kingdoms","Kalachuris, Hoysalas and Yadavas were among the powers of the wider Deccan. This is regional context, not a verified succession of rulers at each of the three sites.","map","U"],["Medieval Deccan","14th–16th century","The Vijayanagara era","The district administration records that Badami came under Vijayanagara rule. The older sacred buildings survived changing political circumstances.","badami","B"],["Medieval Deccan","14th–17th century","Sultanates and forts","The Bahmani Sultanate and its successors reshaped the Deccan. Badami was subsequently held by the Adil Shahis. The Vijayanagara and sultanate periods overlap; surviving fortifications have multiple historical phases.","badami","B"],["Regional powers","17th–19th century","A changing frontier","Badami’s later history includes the Savanur Nawabs, Marathas, Hyder Ali and British rule. Precise construction dates for individual fortifications require additional evidence.","map","B"],["Colonial period","19th century","Recording the monuments","Nineteenth-century archaeological photography documented monuments before modern conservation. The archival Papanatha photograph records earlier surviving fabric.","land","U"],["Modern India","20th century","Preserving the stone","Documentation, conservation and interpretation became essential to protecting the surviving monuments.","pattadakal","A"],["World Heritage","1987","A world heritage landmark","Pattadakal was inscribed on the UNESCO World Heritage List in 1987 for its exceptional architectural achievements.","pattadakal","W"],["Living heritage","2015–present","The story continues","The Indian submission dated 9 February 2015 proposes a wider heritage ensemble spanning Aihole, Badami and Pattadakal. This is a tentative-list proposal, not a separate World Heritage inscription.","land","U"]],"sites":[["Aihole","Durga Temple","Early medieval; debated","A rare apsidal (horseshoe-ended) shrine with a passage around the sanctum and an entrance porch. The surviving colonnade and raised platform make the plan particularly legible.","U","Look for the curved rear end and the corridor around the shrine.","The Durga Temple of Aihole.jpg","The Durga shrine demonstrates how a curved sanctuary and surrounding colonnade can be combined in a freestanding stone building. Its plan illustrates the range of solutions explored at Aihole, rather than a universal Chalukyan temple plan."],["Aihole","Lad Khan","Early Chalukyan; debated","An early structural experiment: the shrine stands against the rear of a pillared hall beneath a low roof rather than a developed tower.","U","Compare the roof profile with Konti Gudi.","Lad Khan temple, Aihole, Karnataka.jpg","Lad Khan is important because the hall and roof are more prominent than a tall tower. Its fabric illustrates the diversity of structural shrines before the monumental forms seen at Pattadakal."],["Aihole","Ravana Phadi","Early Chalukyan","An early Shaiva rock-cut sanctuary. Its carved Shiva panels illustrate the transition from rock excavation to complex sacred interiors.","T","Compare the excavated facade with the freestanding Lad Khan shrine.","Aihole si05-1408.jpg","Ravana Phadi presents a contrasting architectural method: a sanctuary excavated from rock rather than assembled from separate blocks. Its Shiva imagery shows how sacred sculpture and architectural space were designed together."],["Aihole","Meguti Jain Temple","634 CE inscription","Jain hilltop sanctuary with a circumambulatory passage and a hall in front. Its inscription, associated with Pulakeshin II and Ravikirti, is dated 634 CE.","U","Study the relationship between the shrine and surrounding passage.","Meguti Jain temple Aihole.jpg","Meguti is both a Jain monument and an important historical record. Ravikirti’s inscription provides a dated reference for the reign of Pulakeshin II, connecting architecture with written evidence."],["Aihole","Huchimalli","Early medieval","An example of a developed northern-style Rekha superstructure. Its sanctum is incorporated into the enclosed hall.","U","Notice the tower above the sanctuary.","Huchimalligudi Temple, Aihole.JPG","Huchimalli demonstrates how the enclosed hall and sanctuary relate to the tower. Comparison with Lad Khan shows that Aihole was not defined by just one building type."],["Aihole","Konti group","Early medieval","The group includes four identified structures in India’s heritage nomination. Their sanctums are positioned at the rear of pillared halls, with low roof forms.","U","Compare the four buildings rather than assuming one standard plan.","Aihole Konti Gudi 1.jpg","The Konti group is a comparative ensemble: adjoining buildings allow variations in roof, hall and sanctuary arrangement to be studied in one location. Exact building phases remain a separate question."],["Badami","Cave 1","Late 6th century","The first cave is Shaiva. Its reliefs include eighteen-armed dancing Shiva, Ganesha and Ardhanarishvara; the ceiling includes a serpent motif.","B","Look at the Nataraja relief and ceiling.","Rock Cut Cave 1, Badami.jpg","Cave 1 combines an excavated hall with an elaborate Shaiva sculptural programme. Its Nataraja and other figures demonstrate that the cave was designed as a complete sacred interior."],["Badami","Cave 2","Late 6th century","Vaishnava themes predominate, notably Trivikrama and Bhuvaraha. Ceiling carvings include directional deities.","B","Compare the Vishnu imagery with Cave 1.","7th century Cave 2 entrance, Badami Hindu cave temple Karnataka 1.jpg","Cave 2 is an example of the Vaishnava tradition at Badami. Its Vishnu reliefs and ceiling carvings reveal how religious imagery was distributed throughout the architecture."],["Badami","Cave 3","578 CE inscription","The largest cave contains an inscription recording Mangalesha’s foundation in 578 CE. Vishnu-related reliefs include Narasimha and Trivikrama.","B","Inspect the carved brackets and expansive hall.","6th century entrance to Cave 3, Badami Hindu cave temple Karnataka.jpg","The dated inscription makes Cave 3 a key chronological reference for Badami’s rock-cut architecture. Its scale and sculptured pillars demonstrate the ambition of Early Chalukyan workshops."],["Badami","Cave 4","Early medieval","A Jain sanctuary east of Cave 3, with Mahavira in the sanctum and reliefs of other Tirthankaras.","B","Compare the Jain sculptural programme with the Hindu caves.","Entrance of the Badami cave temple no.4.jpg","Cave 4 demonstrates the religious diversity of the Badami complex. Jain images coexist in a landscape of Shaiva and Vaishnava sanctuaries, illuminating the range of religious patronage."],["Badami","Upper Shivalaya","Early Chalukyan","On the northern hill, its southern-style tower rises above a shrine with a surrounding passage. Part of the hall has collapsed.","U","Look for the remaining hall and rear circular openings.","Upper Shivalaya - Badami.jpg","Upper Shivalaya helps trace the development of freestanding stone construction at Badami. Its tower and passage around the sanctuary offer a comparison with the more developed temples at Pattadakal."],["Badami","Lower Shivalaya","Early medieval","A surviving sanctum with a southern-style tower on the northern hill. The district administration describes it as the remnant of a larger temple.","B","Distinguish surviving fabric from any reconstruction.","HBPA N 989 Badami Lower Shivalaya.jpg","Lower Shivalaya is valuable precisely because it is fragmentary: the surviving shrine can be examined without assuming the missing structure looked like another monument."],["Badami","Malegitti Shivalaya","Early Chalukyan","A structural temple on the northern outcrop. A porch leads to an enclosed pillared hall and sanctuary beneath a southern tower.","U","Study the sequence of spaces from porch to shrine.","HBPA N 1010 Malegitti Shivalaya Badami.jpg","Malegitti Shivalaya illustrates the organization of sacred space through a sequence of porch, enclosed hall and shrine beneath a southern-style tower."],["Badami","Bhutanatha","Multiple phases","The main lakeside shrine has a pillared hall connected to its sanctum and a southern superstructure. Its entrance porch is a later addition.","U","Notice how the lake and successive building phases shape the complex.","Bhutanatha temple complex in Badami with Agastya Lake.jpg","Bhutanatha shows how architecture develops in successive phases. The lakeside position and later porch addition reveal the relationship between monuments and their surroundings."],["Badami","Agastya Lake and Fort","Multiple phases","The district identifies hilltop fortifications, storage structures and temples overlooking the Agastya Tirtha tank. These features represent different phases of occupation.","B","Read the lake, cliffs and fort as a landscape rather than a single building.","Upper and Lower Shivalaya by the Badami Town and Agastya Lake.jpg","The fortified hills and tank explain why Vatapi’s setting mattered. The water, natural cliffs and surviving buildings represent a landscape occupied and altered over many historical periods."],["Pattadakal","Kadasiddheshwara","7th century, attributed","ASI attributes this compact shrine to the seventh century. A hall and sanctuary support a northern-style architectural composition.","A","Compare its tower with the southern forms nearby.","Kadasiddheshvara Temple, Pattadakal, Karnataka, India.jpg","Kadasiddheshwara is useful for comparing compact northern-style shrines with the larger southern complexes nearby. Even modest buildings participated in architectural experimentation."],["Pattadakal","Jambulingeshwara","7th century, attributed","A northern-style shrine with a facade arch and a relief showing dancing Shiva alongside Parvati and Nandi.","P","Look for the carved facade projection.","Jambulingeshwara Temple, Pattadikal.jpg","Jambulingeshwara’s northern tower and sculpted façade illustrate the relationship between architectural elevation and religious imagery. Compare its scale with Virupaksha."],["Pattadakal","Sangameshwara","c. 697–733 CE","Built under Vijayaditya (697–733 CE), the temple has three tower storeys and a covered passage around the sanctuary.","A","Compare its square plan and absent sukanasika with Virupaksha.","Pattadakal - Sangameshwara Temple.jpg","Sangameshwara is an important predecessor of the larger southern-style royal shrines. Its three-level tower and enclosed circumambulatory passage illuminate the architectural development described by ASI."],["Pattadakal","Galaganatha","8th century, attributed","Its sandstone northern tower and relief of Shiva overcoming Andhakasura are noted by the district administration; the building may be unfinished.","P","Compare the curving tower with Sangameshwara.","Galaganatha temple Pattadakal.jpg","Galaganatha demonstrates the curving northern tower tradition at Pattadakal. Its juxtaposition with southern-style temples is evidence of different approaches within one major site."],["Pattadakal","Chandrashekhara","Early medieval","A smaller shrine within the Pattadakal monument group. The precise construction date is not established by the institutional sources used here.","W","Use the photograph to study its restrained massing.","Pattadakal, Chandrashekhara temple.jpg","Chandrashekhara contrasts with elaborate royal shrines. Its modest form is valuable for comparing structures within the heritage group; a precise patron or construction date is not established in the sources used here."],["Pattadakal","Kashi Vishwanatha","8th century, attributed","ASI identifies this shrine as a late example of the Early Chalukyan building tradition. It belongs to the northern-style group at Pattadakal.","A","Compare the roof profile with Galaganatha. The photograph shows this temple at right.","7th - 8th century Galaganatha, Sangameswara and Kashivishweswara (right) Hindu temples, Pattadakal monuments Karnataka.jpg","Kashi Vishwanatha is attributed by ASI to the late phase of Early Chalukyan building at Pattadakal. Its northern-style form demonstrates the mature site’s architectural diversity."],["Pattadakal","Mallikarjuna","8th century","Commissioned by Queen Trailokyamahadevi, it is smaller than Virupaksha and has a four-storeyed tower with rounded neck and crowning element.","A","Compare the two queens’ temples side by side.","Mallikarjuna Temple, Pattadakal, Karnataka.jpg","Mallikarjuna is significant for royal female patronage and its relationship to Virupaksha. Comparing the two reveals related architectural ideas at different scales and distinct narrative sculptures."],["Pattadakal","Virupaksha","c. 740 CE","Queen Lokamahadevi commissioned this temple around 740 CE after Vikramaditya II’s victories. Its large complex includes axial halls, subsidiary shrines and enclosure gateways.","W","Identify the tower, halls and gateways.","Virupaksha temple side view from entrance to Mallikarjuna Temple.jpg","Virupaksha is central to understanding the culmination of Chalukyan architecture. Its integrated shrine, halls and enclosure demonstrate a mature approach to planning. UNESCO identifies it as an outstanding monument of the group."],["Pattadakal","Papanatha","c. 680 CE (district attribution; debated)","An ornate shrine outside the main enclosure, with epic narrative carvings. The district dates it approximately to 680 CE; other chronologies vary.","P","Inspect the reliefs from the Ramayana and Mahabharata.","Papanatha temple at Pattadakal.jpg","Papanatha preserves a different approach to temple design from the large southern-style complexes. Its epic reliefs connect sculptural narratives with architecture; published dates differ."],["Pattadakal","Jain Narayana","9th century, attributed","A ninth-century Jain shrine associated by ASI with Rashtrakuta Krishna II. The two lower levels of its tower are functional.","A","Compare its multi-level form with earlier Chalukyan shrines.","Jain Narayana temple at Pattadakal 1.jpg","Jain Narayana establishes that major religious building at Pattadakal continued after the Early Chalukya dynasty. ASI associates it with ninth-century Rashtrakuta patronage, making it a marker of the next historical phase."]],"terms":[["Adhisthana","Raised base or plinth."],["Garbhagriha","Innermost sanctuary housing the sacred image."],["Pradakshina patha","Circumambulatory passage, where present."],["Antarala","Vestibule between shrine and hall."],["Stambha","Pillar."],["Mandapa","Pillared hall."],["Mukhamandapa","Entrance porch."],["Dvarashakha","Doorframe member."],["Prastara","Horizontal entablature."],["Vimana","Southern shrine or its superstructure, depending on context."],["Shikhara","Tower or crowning element; usage varies by tradition."],["Griva","Neck below the crowning element."],["Kalasha","Vessel-shaped finial, where present."],["Nagara","Northern architectural tradition."],["Dravida","Southern architectural tradition with tiered forms."],["Vesara","Variable historical terminology for Deccan forms; not a fixed hybrid category."]],"sources":{"U":["UNESCO — Evolution of Temple Architecture","https://whc.unesco.org/en/tentativelists/5972/"],"W":["UNESCO — Pattadakal","https://whc.unesco.org/en/list/239/"],"A":["Archaeological Survey of India — Pattadakal","https://asi.nic.in/pages/WorldHeritagePattadakal"],"B":["Bagalkote District — Badami","https://bagalkot.nic.in/en/tourist-place/badami-caves/"],"T":["Karnataka Tourism — Aihole","https://karnatakatourism.org/en/destinations/aihole/"],"P":["Bagalkote District — Pattadakal","https://bagalkot.nic.in/en/tourist-place/pattadakal/"],"H":["Bagalkote District — regional history","https://bagalkot.nic.in/en/history/"],"K":["Karnataka Tourism — Koppal and Itagi","https://karnatakatourism.org/en/destinations/koppal/"]}}</script>

for(let i=0;i<6;i++){let a=35+i*35;t+=rect(a,77,12,54,'#d3a16d')+rect(a-3,73,18,7,'#b77d4d')+rect(a-3,126,18,5,'#765034');}

else if(type==='nagara'){t+='<path d="M125 58 Q129 9 166 -13 Q202 11 209 58Z" fill="#bc8252"/>';for(let i=0;i<4;i++)t+='<path d="M'+(135+i*15)+' 57 Q '+(142+i*9)+' 12 166 -12" fill="none" stroke="#70472f" stroke-width="2"/>';t+=rect(151,-17,30,5,'#d9a26b');}

 original:'https://upload.wikimedia.org/wikipedia/commons/6/64/Meguti_Jain_temple_Aihole.jpg',
 artist:'Rajeshodayanchal',lic:'CC BY 3.0',license:'https://creativecommons.org/licenses/by/3.0/',
 page:'https://commons.wikimedia.org/wiki/File:Meguti_Jain_temple_Aihole.jpg'
});

photoCache.set(heroFile,{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Mallikarjuna_and_Virupaksha_Temples-Pattadakal.jpg/1280px-Mallikarjuna_and_Virupaksha_Temples-Pattadakal.jpg',artist:'Shivajidesai29',lic:'CC BY-SA 4.0',license:'https://creativecommons.org/licenses/by-sa/4.0/',page:heroPage});
function photoMarkup(file,caption,extra=''){
 const link='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file.replace(/ /g,'_'));
 return '<figure class="real-photo '+extra+'" data-file="'+esc(file)+'"><div class="photo-slot">Loading photograph…</div><figcaption>'+esc(caption)+' <span class="photo-credit"><a href="'+link+'" target="_blank" rel="noopener">Original photograph / licence</a></span></figcaption></figure>';
}
function plainText(s){return (new DOMParser().parseFromString(String(s||''),'text/html').body.textContent||'').trim();}

const chapterPhotos=[
 [14,'Malaprabha region: present-day Badami landscape, not a prehistoric reconstruction'],
 ['ai1','Imagined early settlement before the surviving temples were built'],

function aiMarkup(index,caption,extra=''){
 const col=index%4,row=Math.floor(index/4);
 return '<figure class="ai-figure chapter-photo '+extra+'"><div class="ai-frame"><div class="ai-art" role="img" aria-label="'+esc(caption)+'" style="background-position:'+(col*100/3)+'% '+(row*50)+'%"></div><span class="ai-label">AI RECONSTRUCTION</span></div><figcaption>'+esc(caption)+'<span class="photo-credit">Artistic interpretation, not an authentic portrait or archaeological reconstruction.</span></figcaption></figure>';
}
function historyPhoto(i){

 if(typeof j==='string'&&j.startsWith('ai'))return aiMarkup(Number(j.slice(2)),caption);
 return photoMarkup(j==='archive'?archiveFile:j==='hero'?heroFile:(typeof j==='string'?extraPhotoFiles[j]:photoFiles[j]),caption,'chapter-photo');

let catalogPromise=null;
function getCatalog(){
 if(catalogPromise)return catalogPromise;
 catalogPromise=(async()=>{
  const titles=[...new Set([...photoFiles,archiveFile,heroFile,...Object.values(extraPhotoFiles)])],batches=[];
  for(let i=0;i<titles.length;i+=12)batches.push(titles.slice(i,i+12));
  await Promise.all(batches.map(async batch=>{
   const params=new URLSearchParams({action:'query',format:'json',origin:'*',redirects:'1',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'960',titles:batch.map(t=>'File:'+t).join('|')});
   try{
    const res=await fetch('https://commons.wikimedia.org/w/api.php?'+params,{signal:typeof AbortSignal!=='undefined'&&AbortSignal.timeout?AbortSignal.timeout(15000):undefined});
    if(!res.ok)throw Error('Photo metadata unavailable');
    const j=await res.json(),q=j.query||{};
    const aliases=new Map([...(q.normalized||[]),...(q.redirects||[])].map(x=>[x.from,x.to]));
    for(const p of Object.values(q.pages||{})){
     const v=p.imageinfo?.[0];if(!v)continue;
     const m=v.extmetadata||{},lic=plainText(m.LicenseShortName?.value),artist=plainText(m.Artist?.value)||plainText(m.Credit?.value);
     if(!/^(CC BY|CC0|Public domain|PD)/i.test(lic)||(!artist&&/^CC BY/i.test(lic)))continue;
     const item={url:v.thumburl||v.url,artist,lic,license:m.LicenseUrl?.value||'',page:v.descriptionurl,original:v.url};
     photoCache.set(p.title.replace(/^File:/,''),item);
     for(const title of batch){let t='File:'+title;for(let n=0;n<5&&aliases.has(t);n++)t=aliases.get(t);if(t===p.title)photoCache.set(title,item);}
    }
   }catch(e){console.warn('Commons photo lookup failed:',e);}
  }));
 })();
 return catalogPromise;
}
function displayPhoto(f,v){
 const slot=f.querySelector('.photo-slot');if(!slot||!v)return;
 const img=document.createElement('img');img.alt=f.querySelector('figcaption').firstChild.textContent.trim();
 img.loading=f.classList.contains('hero-photo')?'eager':'lazy';img.decoding='async';
 if(f.classList.contains('hero-photo'))img.fetchPriority='high';
 img.src=v.url;img.onerror=()=>{if(v.original&&!img.dataset.retried){img.dataset.retried='1';img.src=v.original;return;}slot.textContent='Photograph unavailable — see original link below.';};
 slot.replaceChildren(img);
 const credit=f.querySelector('.photo-credit');credit.replaceChildren(document.createTextNode((v.artist?v.artist+' · ':'')+v.lic+' · '));
 const a=document.createElement('a');a.href=v.page||'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(f.dataset.file);a.target='_blank';a.rel='noopener';a.textContent='Wikimedia Commons';credit.append(a);
 if(v.license&&v.license.startsWith('https://')){const l=document.createElement('a');l.href=v.license;l.target='_blank';l.rel='noopener';l.textContent=' · Licence';credit.append(l);}
}
async function loadPhotos(){
 const figures=[...document.querySelectorAll('.real-photo:not([data-requested])')];
 figures.forEach(f=>{f.dataset.requested='1';if(photoCache.has(f.dataset.file))displayPhoto(f,photoCache.get(f.dataset.file));});
 await getCatalog();
 for(const f of figures){if(!f.isConnected)continue;const v=photoCache.get(f.dataset.file);if(v){if(!f.querySelector('img'))displayPhoto(f,v);}else{f.querySelector('.photo-slot').textContent='Photograph unavailable — use the original file link below.';}}
}
const stages=[["Adhisthana","Layered mouldings form the raised stone base."],["Garbhagriha","The sanctuary is the sacred core; its doorway faces the vestibule and hall."],["Antarala","A short vestibule links the sanctuary and hall along the same axis."],["Stambha","Stone pillars with moulded bases, shafts and capitals support the hall."],["Mandapa","The pillared hall accommodates ritual movement and assembly."],["Mukhamandapa","The entrance porch leads visitors into the hall."],["Prastara","Beams, projecting cornices and stone roof slabs span the interior."],["Dravida vimana","Three progressively smaller tower levels rise above the sanctuary; miniature shrine forms articulate the tiers."],["Griva","The neck supports the crowning roof above the tower."],["Shikhara and stupi","The crowning roof and finial complete this simplified southern-form shrine."]];
